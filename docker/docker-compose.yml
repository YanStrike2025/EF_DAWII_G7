# Infraestructura local del proyecto. Levantar con:  docker compose up -d
#   MySQL         localhost:5510   (usuario app / password)  -> bases courier_db y tracking_db se crean solas
#   phpMyAdmin    http://localhost:3410
#   Kafka         localhost:9092   |  Kafka UI  http://localhost:8090
#   RabbitMQ      localhost:5672   |  Consola   http://localhost:15672  (guest / guest)
services:

  db:
    image: mysql:8.0
    container_name: courier-mysql
    restart: always
    ports:
      - "5510:3306"
    environment:
      MYSQL_DATABASE: courier_db
      MYSQL_USER: app
      MYSQL_PASSWORD: password
      MYSQL_ROOT_PASSWORD: password
    volumes:
      - courier-db:/var/lib/mysql

  phpmyadmin:
    image: phpmyadmin/phpmyadmin:latest
    container_name: courier-phpmyadmin
    ports:
      - "3410:80"
    environment:
      PMA_HOST: db
    depends_on:
      - db

  zookeeper:
    image: confluentinc/cp-zookeeper:7.4.0
    container_name: courier-zookeeper
    environment:
      ZOOKEEPER_CLIENT_PORT: 2181
      ZOOKEEPER_TICK_TIME: 2000

  kafka:
    image: confluentinc/cp-kafka:7.4.0
    container_name: courier-kafka
    depends_on:
      - zookeeper
    ports:
      - "9092:9092"
    environment:
      KAFKA_BROKER_ID: 1
      KAFKA_ZOOKEEPER_CONNECT: zookeeper:2181
      KAFKA_LISTENERS: INTERNAL://0.0.0.0:29092,EXTERNAL://0.0.0.0:9092
      KAFKA_ADVERTISED_LISTENERS: INTERNAL://kafka:29092,EXTERNAL://localhost:9092
      KAFKA_LISTENER_SECURITY_PROTOCOL_MAP: INTERNAL:PLAINTEXT,EXTERNAL:PLAINTEXT
      KAFKA_INTER_BROKER_LISTENER_NAME: INTERNAL
      KAFKA_OFFSETS_TOPIC_REPLICATION_FACTOR: 1
      KAFKA_AUTO_CREATE_TOPICS_ENABLE: "true"

  kafka-ui:
    image: provectuslabs/kafka-ui:latest
    container_name: courier-kafka-ui
    depends_on:
      - kafka
    ports:
      - "8090:8080"
    environment:
      KAFKA_CLUSTERS_0_NAME: courier-local
      KAFKA_CLUSTERS_0_BOOTSTRAPSERVERS: kafka:29092

  rabbitmq:
    image: rabbitmq:3-management
    container_name: courier-rabbitmq
    ports:
      - "5672:5672"
      - "15672:15672"
    environment:
      RABBITMQ_DEFAULT_USER: guest
      RABBITMQ_DEFAULT_PASS: guest

volumes:
  courier-db:
