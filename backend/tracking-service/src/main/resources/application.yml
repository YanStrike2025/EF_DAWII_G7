spring:
  application:
    name: tracking-service
  datasource:
    url: jdbc:mysql://localhost:5510/tracking_db?createDatabaseIfNotExist=true&useSSL=false&allowPublicKeyRetrieval=true&serverTimezone=America/Lima
    username: app
    password: password
  jpa:
    hibernate:
      ddl-auto: update
    show-sql: true
  kafka:
    bootstrap-servers: localhost:9092
    consumer:
      key-deserializer: org.apache.kafka.common.serialization.StringDeserializer
      value-deserializer: org.springframework.kafka.support.serializer.JsonDeserializer
      auto-offset-reset: earliest
      properties:
        spring.json.trusted.packages: "com.cibertec.trackingservice.kafka"
        spring.json.use.type.headers: false
        spring.json.value.default.type: "com.cibertec.trackingservice.kafka.TrackingStatusEvent"
  rabbitmq:
    host: localhost
    port: 5672
    username: guest
    password: guest

server:
  port: 8084

app:
  jwt:
    # Debe ser IDENTICO al de courier-service: aqui solo se valida el token
    secret: "courier-express-jwt-secret-key-2026-minimo-32-caracteres"
  kafka:
    topic-tracking: tracking-status
  rabbitmq:
    queue-notificaciones: notificaciones.envio

eureka:
  client:
    service-url:
      defaultZone: http://localhost:8761/eureka/
